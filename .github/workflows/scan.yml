name: paper-scan

# One scan approximately every 10 minutes, plus a manual trigger.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan mode (auto | live | canary)"
        required: false
        default: "auto"

# Only one scan at a time; never cancel a run that is mid-write.
concurrency:
  group: paper-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (with persisted state)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper scan
        run: python -m agent.cli scan --mode "${{ github.event.inputs.mode || 'auto' }}"

      - name: Render dashboard
        run: python -m agent.cli dashboard

      - name: Write challenge report
        run: python -m agent.cli report --write docs/report.md

      - name: Persist state back to the repository
        run: |
          git config user.name  "paper-agent"
          git config user.email "paper-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
